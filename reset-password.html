<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c1694f">
  <title>Reset Password — Daily Intake Tracker</title>

  <link rel="icon" type="image/png" href="icons/favicon.png">

  <!-- Google Fonts: Fraunces, Inter, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="eyebrow">DAILY INTAKE TRACKER</div>
      <h1>Choose New Password</h1>
      <div class="rule"></div>
    </header>

    <div class="auth-card" style="margin-top: 10px;">
      <h2>Update Password</h2>
      <p class="sub">Enter your new secure password below</p>

      <div id="resetAlert" class="hidden"></div>

      <form id="resetPasswordForm" onsubmit="handleResetSubmit(event)">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat new password" autocomplete="new-password">

        <button type="submit" id="resetSubmitBtn" class="btn-primary">Update Password</button>
      </form>

      <div style="text-align: center; margin-top: 18px;">
        <a href="index.html" class="btn-link">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function showAlert(msg, isError) {
      const alertBox = document.getElementById('resetAlert');
      alertBox.textContent = msg;
      alertBox.className = isError ? 'error-msg' : 'info-msg';
      alertBox.classList.remove('hidden');
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetSubmitBtn');

      if (newPass !== confirmPass) {
        showAlert("Passwords do not match. Please re-enter.", true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        await window.intakeAuth.updatePassword(newPass);
        showAlert("Password updated successfully! You can now sign in with your new password.", false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } catch (err) {
        showAlert(err.message || "Failed to update password. Link may have expired.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
